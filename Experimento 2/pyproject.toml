[project]
name = "experimento2"
version = "0.1.0"
description = "Replicação do MemoryAgentBench, direta e na OAB"
requires-python = ">=3.12"
dependencies = [
    "openai",
    "anthropic>=1.0",
    "tiktoken",
    "nltk>=3.9",
    "rank-bm25",
    "numpy",
    "pyarrow",
    "huggingface-hub",
    "python-dotenv",
    "matplotlib",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["replica"]

[tool.uv]
package = true
# Projeto só roda no Windows do Pedro; evita resolver rodas de macOS/Linux.
environments = ["sys_platform == 'win32'"]
