[project]
name = "memoria"
version = "0.1.0"
description = "Memória passiva e memória ativa com LLM: dois exemplos comparáveis"
requires-python = ">=3.12"
dependencies = ["anthropic", "python-dotenv"]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["memoria"]

[tool.pytest.ini_options]
testpaths = ["tests"]
